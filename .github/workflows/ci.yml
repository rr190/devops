Step 2 — Create the workflow file

Create the folder struc file ci.yml inside it:

mkdir .github\workflows
notepad .github\workflows\ci.yml

Paste this in:

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/s
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-lat
    needs: test
    steps:
      - uses: actions/c

      - name: Build Docker image
        run: docker build -t task-tracker:latest .